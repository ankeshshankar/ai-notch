# Builds AI Notch on macOS for every push and pull request, and runs the VPN helper's self-check
# (the profile check and the management-interface parser).
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: VPN helper self-check
        run: .build/release/ai-notch-vpnd selfcheck
      # A look at the open notch with sample sessions, for a design check. Never fails the build.
      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 3
        run: scripts/dev/ci-screenshots.sh screenshots
      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notch-screenshots
          path: screenshots/
          if-no-files-found: ignore
