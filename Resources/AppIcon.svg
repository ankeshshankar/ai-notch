<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824-point body inside the 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- The notch, hanging from the top edge, with its two signals -->
  <path d="M 268 100 H 756 V 214 Q 756 288 682 288 H 342 Q 268 288 268 214 Z" fill="#000"/>
  <circle cx="356" cy="194" r="38" fill="none" stroke="#3a2a24" stroke-width="16"/>
  <path d="M 356 156 A 38 38 0 1 1 318.6 200.6" fill="none" stroke="#d97757" stroke-width="16" stroke-linecap="round"/>
  <circle cx="668" cy="194" r="26" fill="#f5a524"/>
  <circle cx="668" cy="194" r="40" fill="none" stroke="#f5a524" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Sessions below it -->
  <g>
    <rect x="216" y="372" width="592" height="112" rx="34" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="276" cy="428" r="20" fill="#d97757"/>
    <rect x="322" y="410" width="270" height="20" rx="10" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="322" y="442" width="170" height="16" rx="8" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="660" y="412" width="104" height="32" rx="16" fill="#d97757" fill-opacity="0.9"/>

    <rect x="216" y="512" width="592" height="112" rx="34" fill="#f5a524" fill-opacity="0.16"/>
    <circle cx="276" cy="568" r="20" fill="#f5a524"/>
    <rect x="322" y="550" width="230" height="20" rx="10" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="322" y="582" width="200" height="16" rx="8" fill="#f5a524" fill-opacity="0.6"/>
    <rect x="660" y="552" width="104" height="32" rx="16" fill="#f5a524"/>

    <rect x="216" y="652" width="592" height="112" rx="34" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="276" cy="708" r="20" fill="#4cc38a"/>
    <rect x="322" y="690" width="290" height="20" rx="10" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="322" y="722" width="140" height="16" rx="8" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="660" y="692" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.18"/>
  </g>
</svg>
